name: AGENTS/CLAUDE mirror sync

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-doc-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify AGENTS.md and CLAUDE.md
        run: python scripts/verify_agent_claude_sync.py
